name: build-karl-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform 34
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Export NDK paths
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4

      - name: Build native arm64-v8a
        run: |
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs -- build -p axiom-android --release
          find android/app/src/main/jniLibs -type f -ls || true

      - name: Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp
            /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Assemble APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          find android/app/src/main/jniLibs -name '*.so' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: axiom-karl-apk
          path: dist/
          if-no-files-found: warn
          retention-days: 14
