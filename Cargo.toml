[workspace]
resolver = "2"
members = [
  "rust/axiom-mobile-core",
  "rust/axiom-runner",
  "rust/axiom-android",
]
default-members = ["rust/axiom-mobile-core", "rust/axiom-runner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Axiom Lab"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "=1.11.1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
