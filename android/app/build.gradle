plugins { id 'com.android.application' }
android {
  namespace 'com.axiom.mobile'
  compileSdk 34
  defaultConfig {
    applicationId "com.axiom.mobile"
    minSdk 26
    targetSdk 34
    versionCode 1
    versionName "0.1.0-karl"
    ndk { abiFilters 'arm64-v8a' }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.debug }
  }
}
