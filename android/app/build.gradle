plugins {
    id 'com.android.application'
}

android {
    namespace 'com.axiom.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.axiom.mobile"
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName "0.2.0-m2-shell"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
