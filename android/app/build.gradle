plugins { id 'com.android.application' }
android {
  namespace 'com.axiom.mobile'
  compileSdk 34
  defaultConfig {
    applicationId "com.axiom.mobile"
    minSdk 26
    targetSdk 34
    versionCode 4
    versionName "0.1.3-karl"
    ndk { abiFilters 'arm64-v8a' }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.debug }
  }
  packaging {
    jniLibs {
      useLegacyPackaging = true
    }
  }
  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}
